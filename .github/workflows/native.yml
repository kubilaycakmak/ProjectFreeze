name: Native verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.runner }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        node: [24]
        include:
          - runner: ubuntu-24.04
            node: 26
          - runner: windows-2025
            node: 26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run build:native
      - run: npm test
      - name: Verify user service and timer control
        if: matrix.runner == 'ubuntu-24.04' && matrix.node == 24
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -un)"
          trap 'sudo loginctl disable-linger "$(id -un)"' EXIT
          for i in {1..20}; do test -S "$XDG_RUNTIME_DIR/bus" && break; sleep 1; done
          PF_TEST_SYSTEMD=1 node --test test/systemd.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 24
        with:
          name: helper-${{ matrix.runner }}
          path: helpers/projectfreeze-*
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: helper-*
          path: helpers
          merge-multiple: true
      - run: |
          chmod +x helpers/projectfreeze-{linux,darwin}-*
          chmod 644 helpers/*.sha256
          node scripts/package.js --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-tarball
          path: dist/
          if-no-files-found: error

  consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-tarball
          path: dist
      - run: node scripts/consumer.js
