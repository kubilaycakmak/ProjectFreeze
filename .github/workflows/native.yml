name: Native verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.runner }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
        node: [24]
        include:
          - runner: ubuntu-24.04
            node: 26
          - runner: windows-2025
            node: 26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: 10.0.100
      - name: Select the pinned Roslyn compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "PF_DOTNET_SDK=$env:DOTNET_ROOT/sdk/10.0.100"
      - run: npm run build:native
      - run: node scripts/reproducible.js
      - run: npm test
      - name: Verify native LaunchAgent control
        if: runner.os == 'macOS' && matrix.runner == 'macos-15'
        run: PF_TEST_LAUNCHD=1 node --test test/supervisors.test.js
      - name: Verify Windows Task Scheduler and SCM control
        if: matrix.runner == 'windows-2025' && matrix.node == 24
        shell: pwsh
        run: |
          $env:PF_TEST_WINDOWS_SUPERVISORS = '1'
          node --test test/supervisors.test.js
      - name: Verify user service and timer control
        if: matrix.runner == 'ubuntu-24.04' && matrix.node == 24
        shell: bash
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo loginctl enable-linger "$(id -un)"
          trap 'sudo loginctl disable-linger "$(id -un)"' EXIT
          for i in {1..20}; do test -S "$XDG_RUNTIME_DIR/bus" && break; sleep 1; done
          PF_TEST_SYSTEMD=1 node --test test/systemd.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 24
        with:
          name: helper-${{ matrix.runner }}
          path: helpers/projectfreeze-*
          if-no-files-found: error

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: helper-*
          path: helpers
          merge-multiple: true
      - run: |
          chmod +x helpers/projectfreeze-{linux,darwin}-*
          chmod 644 helpers/*.sha256
          node scripts/package.js --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-tarball
          path: dist/
          if-no-files-found: error

  attest:
    needs: [package, consumer]
    if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || vars.PF_ENABLE_ATTESTATIONS == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-tarball
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/*.tgz'

  consumer:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-tarball
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0a451832004c716370ed1f720d56463c4c876c2c
          path: previous
          persist-credentials: false
      - run: npm run build:native
        working-directory: previous
      - run: node scripts/package.js
        working-directory: previous
      - run: node scripts/consumer.js
        env:
          PF_PREVIOUS_TARBALL: ${{ github.workspace }}/previous/dist/kubilaycakmak-projectfreeze-0.1.0-dev.0.tgz

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: docker pull busybox:1.37
      - run: PF_TEST_DOCKER=1 node --test --test-name-pattern=Compose test/backends.test.js

  criu:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm run build:native
      - run: sudo apt-get update && sudo apt-get install -y criu
      - run: sudo env PF_TEST_CRIU=1 PATH="$PATH:/usr/sbin" "$(command -v node)" --test --test-name-pattern=CRIU test/backends.test.js

  docker-checkpoint:
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y criu
      - name: Enable experimental checkpoint capability on the disposable runner
        shell: bash
        run: |
          sudo install -d /etc/docker
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json | jq '.experimental = true | .features["containerd-snapshotter"] = false' > "$RUNNER_TEMP/docker-daemon.json"
          else
            printf '%s\n' '{"experimental":true,"features":{"containerd-snapshotter":false}}' > "$RUNNER_TEMP/docker-daemon.json"
          fi
          sudo install -m 0644 "$RUNNER_TEMP/docker-daemon.json" /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: docker pull busybox:1.37
      - run: sudo env GITHUB_ACTIONS=true PF_TEST_DOCKER=1 PF_TEST_DOCKER_CHECKPOINT=1 PATH="$PATH:/usr/sbin" "$(command -v node)" --test --test-name-pattern=Compose test/backends.test.js
